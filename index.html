<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0068B5">
    <title>Lịch Trực Ca A1 / A123 (2026 – 2027)</title>
    <style>
        :root {
            --primary: #0068B5;
            --primary-dark: #004a82;
            --bg: #F0F4F8;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-sub: #64748B;
            --border: #E2E8F0;
            --green: #16A34A;
            --red: #DC2626;
            --amber: #D97706;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 20px;
            border-radius: 18px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .header-card h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header-card p {
            font-size: 13px;
            opacity: 0.92;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            color: var(--primary-dark);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        select, input {
            width: 100%;
            padding: 11px 13px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #F8FAFC;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
        }

        .hint {
            font-size: 12px;
            color: var(--text-sub);
            line-height: 1.4;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-full {
            grid-column: span 2;
            background: var(--green);
            color: white;
        }

        button {
            padding: 12px 14px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: #E2E8F0;
            color: var(--text-main);
        }

        .status-box {
            margin-top: 14px;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            background: #F8FAFC;
            border: 1px solid var(--border);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .working {
            background: #FEE2E2;
            color: var(--red);
        }

        .off {
            background: #DCFCE7;
            color: var(--green);
        }

        .status-text {
            font-size: 16px;
            font-weight: 700;
        }

        .status-desc {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .calendar-header h3 {
            font-size: 16px;
            font-weight: 700;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }

        .cal-day-name {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
            padding-bottom: 6px;
        }

        .cal-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 13px;
            background: #F8FAFC;
            padding: 2px;
        }

        .cal-cell.empty {
            background: transparent;
        }

        .cal-cell.today {
            border: 2px solid var(--primary);
            font-weight: 700;
        }

        .cal-cell.work-day {
            background: #FEE2E2;
            color: #B91C1C;
            font-weight: 700;
        }

        .cal-cell.work-night {
            background: #FEF3C7;
            color: #B45309;
            font-weight: 700;
        }

        .cal-cell .tag {
            font-size: 9px;
            margin-top: 1px;
            line-height: 1.1;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-sub);
        }

        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            display: inline-block;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-card">
        <h1>LỊCH LÀM VIỆC CA A1</h1>
        <p>Chuẩn Bảng Q4/2026 & Tự Động Tính Lịch 2027</p>
    </div>

    <div class="card">
        <div class="card-title">⚙️ Cấu Hình Ca Của Bạn</div>

        <div class="form-group">
            <label for="shiftCode">Mã Ca Cá Nhân</label>
            <select id="shiftCode" onchange="saveAndRender()">
                <option value="A1">Ca A1 (1 ngày đầu tuần + T5, T6, T7 cụm A123)</option>
                <option value="A2">Ca A2 (1 ngày đầu tuần + T5, T6, T7 cụm A123)</option>
                <option value="A3">Ca A3 (1 ngày đầu tuần + T5, T6, T7 cụm A123)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="shiftMode">Chế Độ Hiển Thị & Xuất Lịch</label>
            <select id="shiftMode" onchange="saveAndRender()">
                <option value="BOTH">Cả Ca Ngày (DAY) & Ca Đêm (NIGHT) theo bảng xoay</option>
                <option value="DAY_ONLY">Chỉ tính các tuần Ca Ngày (DAY)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="extraDates">Ngày Làm Bù / Ngoại Lệ (YYYY-MM-DD)</label>
            <input id="extraDates" type="text" placeholder="VD: 2026-11-24" onchange="saveAndRender()">
            <div class="hint">Nhập cách nhau dấu phẩy nếu có ngày đi làm bù lễ.</div>
        </div>

        <div class="btn-group">
            <button class="btn-primary" onclick="jumpToToday()">🎯 Hôm Nay</button>
            <button class="btn-secondary" onclick="exportICSYear(2027)">📅 Xuất Lịch 2027 (.ics)</button>
            <button class="btn-full" onclick="exportICS90Days()">📥 Tải Lịch 90 Ngày Tới (.ics)</button>
        </div>

        <div class="status-box">
            <div id="statusBadge" class="status-badge">...</div>
            <div id="statusText" class="status-text">...</div>
            <div id="statusDesc" class="status-desc">...</div>
        </div>
    </div>

    <div class="card">
        <div class="calendar-header">
            <button class="btn-secondary" style="padding: 6px 12px;" onclick="changeMonth(-1)">◀</button>
            <h3 id="monthTitle">...</h3>
            <button class="btn-secondary" style="padding: 6px 12px;" onclick="changeMonth(1)">▶</button>
        </div>
        <div class="calendar-grid" id="calGrid"></div>
        <div class="legend">
            <span><i class="dot" style="background:#FEE2E2;border:1px solid #DC2626"></i> Đi làm (Ngày)</span>
            <span><i class="dot" style="background:#FEF3C7;border:1px solid #D97706"></i> Đi làm (Đêm)</span>
        </div>
    </div>
</div>

<script>
    let viewDate = new Date();

    // Mốc Chủ Nhật 15/11/2026 (đầu WW 47)
    const ANCHOR_SUNDAY = new Date(2026, 10, 15);

    // Chu kỳ 6 tuần chuẩn rút ra từ bảng Q4 (WW47 -> WW52):
    // Mỗi tuần định nghĩa:
    // - sunToTue: 3 mã ca ngày [CN, T2, T3]
    // - a123Type: "DAY" nếu cụm A123 nằm ở hàng DAY, "NIGHT" nếu cụm A123 xoay sang hàng NIGHT
    const SIX_WEEK_CYCLE = [
        // Tuần 0 (WW47: 15-21/11): CN=A3, T2=A1, T3=A2 | A123 ở DAY
        { sunToTue: ["A3", "A1", "A2"], a123Type: "DAY" },
        // Tuần 1 (WW48: 22-28/11): CN=A3, T2=A1, T3=A2 | A123 ở DAY
        { sunToTue: ["A3", "A1", "A2"], a123Type: "DAY" },
        // Tuần 2 (WW49: 29/11-05/12): CN=A3, T2=A1, T3=A2 | A123 ở DAY
        { sunToTue: ["A3", "A1", "A2"], a123Type: "DAY" },
        // Tuần 3 (WW50: 06-12/12): CN=A1, T2=A2, T3=A3 | A123 xoay sang NIGHT
        { sunToTue: ["A1", "A2", "A3"], a123Type: "NIGHT" },
        // Tuần 4 (WW51: 13-19/12): CN=A2, T2=A3, T3=A1 | A123 xoay sang NIGHT
        { sunToTue: ["A2", "A3", "A1"], a123Type: "NIGHT" },
        // Tuần 5 (WW52: 20-26/12): CN=A3, T2=A1, T3=A2 | A123 xoay sang NIGHT
        { sunToTue: ["A3", "A1", "A2"], a123Type: "NIGHT" }
    ];

    function toKey(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }

    function getExtraSet() {
        const raw = document.getElementById("extraDates").value || "";
        return new Set(raw.split(",").map(s => s.trim()).filter(Boolean));
    }

    function getDayStatus(date) {
        const code = document.getElementById("shiftCode").value; // A1, A2, A3
        const mode = document.getElementById("shiftMode").value; // BOTH | DAY_ONLY

        if (getExtraSet().has(toKey(date))) {
            return { work: true, type: "DAY", label: "BÙ" };
        }

        const cleanDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        const diffDays = Math.floor((cleanDate - ANCHOR_SUNDAY) / 86400000);
        const weekIndex = Math.floor(diffDays / 7);
        const cycleIdx = ((weekIndex % SIX_WEEK_CYCLE.length) + SIX_WEEK_CYCLE.length) % SIX_WEEK_CYCLE.length;
        const weekRule = SIX_WEEK_CYCLE[cycleIdx];
        const dow = cleanDate.getDay(); // 0=CN, 1=T2, 2=T3, 3=T4, 4=T5, 5=T6, 6=T7

        // CN, T2, T3: làm đúng 1 ngày trùng mã cá nhân (A1/A2/A3)
        if (dow <= 2) {
            const dayCode = weekRule.sunToTue[dow];
            if (dayCode === code) {
                return { work: true, type: "DAY", label: dayCode };
            }
            return { work: false, type: null, label: dayCode };
        }

        // T4 (dow === 3): nghỉ chuyển ca
        if (dow === 3) {
            return { work: false, type: null, label: "NGHỈ" };
        }

        // T5, T6, T7 (dow === 4, 5, 6): làm cụm A123 (3 ngày)
        if (mode === "DAY_ONLY" && weekRule.a123Type !== "DAY") {
            return { work: false, type: null, label: "ĐÊM" };
        }
        return {
            work: true,
            type: weekRule.a123Type,
            label: weekRule.a123Type === "DAY" ? "A123" : "A123 Đêm"
        };
    }

    function saveAndRender() {
        localStorage.setItem("lich_a1_2026_2027", JSON.stringify({
            shiftCode: document.getElementById("shiftCode").value,
            shiftMode: document.getElementById("shiftMode").value,
            extraDates: document.getElementById("extraDates").value
        }));
        updateTodayStatus();
        renderCalendar();
    }

    function updateTodayStatus() {
        const now = new Date();
        const code = document.getElementById("shiftCode").value;
        const st = getDayStatus(now);

        const badge = document.getElementById("statusBadge");
        const text = document.getElementById("statusText");
        const desc = document.getElementById("statusDesc");
        const dStr = `${String(now.getDate()).padStart(2, "0")}/${String(now.getMonth() + 1).padStart(2, "0")}/${now.getFullYear()}`;

        if (st.work) {
            badge.className = "status-badge working";
            badge.textContent = st.type === "NIGHT" ? "ĐI LÀM (CA ĐÊM)" : "ĐI LÀM";
            text.style.color = st.type === "NIGHT" ? "#B45309" : "#DC2626";
            text.textContent = `Ca ${code} • ${st.label}`;
        } else {
            badge.className = "status-badge off";
            badge.textContent = "NGHỈ";
            text.style.color = "#16A34A";
            text.textContent = `Hôm nay nghỉ ca ${code}`;
        }
        desc.textContent = `Ngày ${dStr}`;
    }

    function renderCalendar() {
        const grid = document.getElementById("calGrid");
        grid.innerHTML = "";
        const y = viewDate.getFullYear();
        const m = viewDate.getMonth();

        document.getElementById("monthTitle").textContent = `Tháng ${m + 1} / ${y}`;

        ["CN", "T2", "T3", "T4", "T5", "T6", "T7"].forEach(d => {
            const el = document.createElement("div");
            el.className = "cal-day-name";
            el.textContent = d;
            grid.appendChild(el);
        });

        const firstDay = new Date(y, m, 1).getDay();
        const totalDays = new Date(y, m + 1, 0).getDate();
        const today = new Date();

        for (let i = 0; i < firstDay; i++) {
            const empty = document.createElement("div");
            empty.className = "cal-cell empty";
            grid.appendChild(empty);
        }

        for (let day = 1; day <= totalDays; day++) {
            const d = new Date(y, m, day);
            const st = getDayStatus(d);
            const isToday = d.getDate() === today.getDate() && d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();

            const cell = document.createElement("div");
            let cls = "cal-cell";
            if (st.work) cls += st.type === "NIGHT" ? " work-night" : " work-day";
            if (isToday) cls += " today";
            cell.className = cls;
            cell.innerHTML = `<span>${day}</span><span class="tag">${st.label}</span>`;
            grid.appendChild(cell);
        }
    }

    function changeMonth(delta) {
        viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + delta, 1);
        renderCalendar();
    }

    function jumpToToday() {
        viewDate = new Date();
        updateTodayStatus();
        renderCalendar();
    }

    function fmtICS(date) {
        return `${date.getFullYear()}${String(date.getMonth() + 1).padStart(2, "0")}${String(date.getDate()).padStart(2, "0")}`;
    }

    function downloadICS(startDate, endDate, filename) {
        const code = document.getElementById("shiftCode").value;
        let lines = [
            "BEGIN:VCALENDAR",
            "VERSION:2.0",
            "PRODID:-//Lich Ca A1 2026-2027//VN",
            "CALSCALE:GREGORIAN"
        ];

        let cur = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());
        const last = new Date(endDate.getFullYear(), endDate.getMonth(), endDate.getDate());

        while (cur <= last) {
            const st = getDayStatus(cur);
            if (st.work) {
                const next = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + 1);
                const s = fmtICS(cur);
                const e = fmtICS(next);
                lines.push(
                    "BEGIN:VEVENT",
                    `UID:${s}-${code}@lich-ca-a1`,
                    `DTSTAMP:${s}T000000Z`,
                    `DTSTART;VALUE=DATE:${s}`,
                    `DTEND;VALUE=DATE:${e}`,
                    `SUMMARY:Ca ${code} (${st.label})`,
                    "END:VEVENT"
                );
            }
            cur.setDate(cur.getDate() + 1);
        }

        lines.push("END:VCALENDAR");
        const blob = new Blob([lines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function exportICS90Days() {
        const now = new Date();
        const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 90);
        downloadICS(now, end, "lich-ca-a1-90-ngay.ics");
    }

    function exportICSYear(year) {
        const start = new Date(year, 0, 1);
        const end = new Date(year, 11, 31);
        downloadICS(start, end, `lich-ca-a1-${year}.ics`);
    }

    window.onload = function() {
        const saved = localStorage.getItem("lich_a1_2026_2027");
        if (saved) {
            try {
                const cfg = JSON.parse(saved);
                if (cfg.shiftCode) document.getElementById("shiftCode").value = cfg.shiftCode;
                if (cfg.shiftMode) document.getElementById("shiftMode").value = cfg.shiftMode;
                if (cfg.extraDates) document.getElementById("extraDates").value = cfg.extraDates;
            } catch (_) {}
        }
        updateTodayStatus();
        renderCalendar();
    };
</script>
</body>
</html>
