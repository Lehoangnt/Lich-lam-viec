function getCellClass(code, selectedKip) {
    let cls = "";
    if (code.startsWith("AC")) cls = "c-AC";
    else if (code.startsWith("BD")) cls = "c-BD";
    else if (code.startsWith("A")) cls = "c-A";
    else if (code.startsWith("B")) cls = "c-B";
    else if (code.startsWith("C")) cls = "c-C";
    else if (code.startsWith("D")) cls = "c-D";

    if (selectedKip !== "ALL_SHIFTS" && code === selectedKip) {
        cls += " highlight-selected";
    }
    return cls;
}

        html += `<div class="month-block"><table>`;

        // 1. Hàng WW
        html += `<tr class="ww-row"><th class="label-col month-name">${m.label} (${m.year})</th>`;
        for (let i = 0; i < n; i++) html += `<td>${m.ww[i]}</td>`;
        html += `</tr>`;

        // 2. Hàng THỨ
        html += `<tr class="dow-row"><th class="label-col">THỨ</th>`;
        for (let i = 0; i < n; i++) {
            let dCls = m.dow[i] === "Sun" ? "sun-cell" : (m.dow[i] === "Sat" ? "sat-cell" : "");
            html += `<td class="${dCls}">${m.dow[i]}</td>`;
        }
        html += `</tr>`;

        // 3. Hàng D.LỊCH
        html += `<tr class="date-row"><th class="label-col">D.LỊCH</th>`;
        for (let i = 0; i < n; i++) {
            html += `<td>${String(m.dates[i]).padStart(2, '0')}</td>`;
        }
        html += `</tr>`;

        // 4. Hàng Â.LỊCH (nếu có)
        if (m.lunar[0] !== "") {
            html += `<tr class="lunar-row"><th class="label-col">Â.LỊCH</th>`;
            for (let i = 0; i < n; i++) html += `<td>${m.lunar[i]}</td>`;
            html += `</tr>`;
        }

        // 5. 4 Hàng Ca
        const shiftRows = [
            { title: "CA NGÀY(C)", arr: m.dayC },
            { title: "CA NGÀY(H.T)", arr: m.dayHT },
            { title: "CA ĐÊM(C)", arr: m.nightC },
            { title: "CA ĐÊM(H.T)", arr: m.nightHT }
        ];

        shiftRows.forEach(row => {
            html += `<tr><th class="label-col">${row.title}</th>`;
            for (let i = 0; i < n; i++) {
                let code = row.arr[i];
                html += `<td class="${getCellClass(code, selectedKip)}">${code}</td>`;
            }
            html += `</tr>`;
        });

        html += `</table></div>`;
    });

    container.innerHTML = html;
}

function downloadICS() {
    const selectedKip = document.getElementById("select-kip").value;
    let ics = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Intel Shift Calendar//VN",
        "CALSCALE:GREGORIAN",
        "METHOD:PUBLISH"
    ];

    SCHEDULE_DATA.forEach(m => {
        let n = m.dates.length;
        for (let i = 0; i < n; i++) {
            let d = m.dates[i];
            let dateStr = `${m.year}${String(m.month).padStart(2,'0')}${String(d).padStart(2,'0')}`;

            // Tính ngày hôm sau cho Ca Đêm
            let nextDateObj = new Date(m.year, m.month - 1, d + 1);
            let nextDateStr = `${nextDateObj.getFullYear()}${String(nextDateObj.getMonth()+1).padStart(2,'0')}${String(nextDateObj.getDate()).padStart(2,'0')}`;

            let dc = m.dayC[i], dht = m.dayHT[i], nc = m.nightC[i], nht = m.nightHT[i];

            // Xuất Ca Ngày
            if (selectedKip === "ALL_SHIFTS" || dc === selectedKip || dht === selectedKip) {
                ics.push(
                    "BEGIN:VEVENT",
                    `DTSTART;TZID=Asia/Ho_Chi_Minh:${dateStr}T070000`,
                    `DTEND;TZID=Asia/Ho_Chi_Minh:${dateStr}T190000`,
                    `SUMMARY:☀️ Ca Ngày (${dc} - ${dht})`,
                    `DESCRIPTION:Ca Ngày: ${dc} | H.T: ${dht} (WW ${m.ww[i]})`,
                    "END:VEVENT"
                );
            }

            // Xuất Ca Đêm
            if (selectedKip === "ALL_SHIFTS" || nc === selectedKip || nht === selectedKip) {
                ics.push(
                    "BEGIN:VEVENT",
                    `DTSTART;TZID=Asia/Ho_Chi_Minh:${dateStr}T190000`,
                    `DTEND;TZID=Asia/Ho_Chi_Minh:${nextDateStr}T070000`,
                    `SUMMARY:🌙 Ca Đêm (${nc} - ${nht})`,
                    `DESCRIPTION:Ca Đêm: ${nc} | H.T: ${nht} (WW ${m.ww[i]})`,
                    "END:VEVENT"
                );
            }
        }
    });

    ics.push("END:VCALENDAR");

    let blob = new Blob([ics.join("\r\n")], { type: "text/calendar;charset=utf-8" });
    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `Lich_Ca_Intel_${selectedKip}_10_2026_04_2027.ics`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

renderAll();
</script>
