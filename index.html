<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0068B5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Lịch Trực Ca Nhà Máy</title>
    <style>
        :root {
            --primary: #0068B5;
            --primary-dark: #004a82;
            --accent: #FF5252;
            --bg: #F0F4F8;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-sub: #64748B;
            --border: #E2E8F0;
            --green: #16A34A;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 20px;
            border-radius: 18px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .header-card h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .header-card p {
            font-size: 13px;
            opacity: 0.9;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 14px;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        select, input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #F8FAFC;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(0, 104, 181, 0.15);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-full {
            grid-column: span 2;
            background: var(--green);
            color: white;
        }

        button {
            padding: 12px 16px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:active, .btn-full:active {
            opacity: 0.9;
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #E2E8F0;
            color: var(--text-main);
        }

        .btn-secondary:active {
            background: #CBD5E1;
            transform: scale(0.98);
        }

        .status-box {
            margin-top: 14px;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            background: #F8FAFC;
            border: 1px solid var(--border);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .status-badge.working {
            background: #FEE2E2;
            color: #DC2626;
        }

        .status-badge.off {
            background: #DCFCE7;
            color: #16A34A;
        }

        .status-text {
            font-size: 16px;
            font-weight: 700;
        }

        .status-desc {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .calendar-header h3 {
            font-size: 16px;
            font-weight: 700;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }

        .cal-day-name {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-sub);
            padding-bottom: 6px;
        }

        .cal-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 13px;
            position: relative;
            background: #F8FAFC;
            border: 1px solid transparent;
        }

        .cal-cell.empty {
            background: transparent;
        }

        .cal-cell.today {
            border: 2px solid var(--primary);
            font-weight: 700;
        }

        .cal-cell.work-day {
            background: #FEE2E2;
            color: #B91C1C;
            font-weight: 700;
        }

        .cal-cell .shift-tag {
            font-size: 9px;
            font-weight: 600;
            margin-top: 2px;
            line-height: 1;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: var(--text-sub);
            padding: 12px 0 24px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-card">
        <h1>LỊCH LÀM VIỆC NHÀ MÁY</h1>
        <p>Q4/2026 – 2027 • Tự Động Xoay Ca & Xuất Lịch iOS</p>
    </div>

    <div class="card">
        <div class="card-title">⚙️ Cấu Hình Ca Trực Của Bạn</div>
        
        <div class="form-group">
            <label for="deptSelect">Bộ Phận / Nhóm:</label>
            <select id="deptSelect" onchange="updateShiftList()">
                <option value="OS_ES_DAY">OS, ES - DAY (Ca Ngày)</option>
                <option value="OS_ES_NIGHT">OS, ES - NIGHT (Ca Đêm)</option>
                <option value="SUP_MSD">Sup, MSD</option>
                <option value="PE_QRE">PE, QRE, Yield Tech</option>
                <option value="OTHER">Other Groups</option>
                <option value="REL">REL</option>
                <option value="TRAINING">Technical Training</option>
            </select>
        </div>

        <div class="form-group">
            <label for="shiftSelect">Mã Ca Trực (Shift Code):</label>
            <select id="shiftSelect" onchange="saveConfigAndRefresh()"></select>
        </div>

        <div class="btn-group">
            <button class="btn-primary" onclick="requestNotification()">🔔 Bật Thông Báo</button>
            <button class="btn-secondary" onclick="checkScheduleToday()">🎯 Hôm Nay</button>
            <button class="btn-full" onclick="exportICS()">📅 Tải / Thêm Lịch iOS (.ics)</button>
        </div>

        <div id="statusBox" class="status-box">
            <div id="statusBadge" class="status-badge">Đang kiểm tra</div>
            <div id="statusText" class="status-text">...</div>
            <div id="statusDesc" class="status-desc">...</div>
        </div>
    </div>

    <div class="card">
        <div class="calendar-header">
            <button class="btn-secondary" style="padding: 6px 12px;" onclick="changeMonth(-1)">◀</button>
            <h3 id="calendarMonthTitle">Tháng ...</h3>
            <button class="btn-secondary" style="padding: 6px 12px;" onclick="changeMonth(1)">▶</button>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="footer">
        Đã lưu cấu hình trực tiếp vào trình duyệt.<br>
        Có thể thêm ra Màn hình chính iPhone để dùng nhanh.
    </div>
</div>

<script>
    const SHIFT_OPTIONS = {
        "OS_ES_DAY": [
            { code: "A1", label: "A1 (Khối A123 - Ca Ngày)" },
            { code: "A2", label: "A2 (Khối A123 - Ca Ngày)" },
            { code: "A3", label: "A3 (Khối A123 - Ca Ngày)" },
            { code: "A123", label: "Toàn Khối A123 (Chủ Nhật, Thứ 2, Thứ 3)" },
            { code: "AC4", label: "AC4 (Ca Ngày Phổ Thông)" },
            { code: "B1", label: "B1 (Khối B123 - Ca Ngày)" },
            { code: "B2", label: "B2 (Khối B123 - Ca Ngày)" },
            { code: "B3", label: "B3 (Khối B123 - Ca Ngày)" },
            { code: "BD4", label: "BD4 (Ca Ngày Phổ Thông)" }
        ],
        "OS_ES_NIGHT": [
            { code: "C1", label: "C1 (Khối C123 - Ca Đêm)" },
            { code: "C3", label: "C3 (Khối C123 - Ca Đêm)" },
            { code: "C123", label: "Toàn Khối C123" },
            { code: "BD4_NIGHT", label: "BD4 (Ca Đêm)" },
            { code: "B123_NIGHT", label: "B123 (Ca Đêm)" }
        ],
        "SUP_MSD": [
            { code: "SA", label: "SA" },
            { code: "SB", label: "SB" },
            { code: "SC", label: "SC" },
            { code: "SD", label: "SD" }
        ],
        "PE_QRE": [
            { code: "AA", label: "AA" },
            { code: "BB", label: "BB" },
            { code: "CC", label: "CC" },
            { code: "DD", label: "DD" }
        ],
        "OTHER": [
            { code: "AB", label: "AB" },
            { code: "CD", label: "CD" },
            { code: "RCD", label: "RCD" },
            { code: "RAB", label: "RAB" }
        ],
        "REL": [
            { code: "RAB", label: "RAB" },
            { code: "RCD", label: "RCD" }
        ],
        "TRAINING": [
            { code: "DTAB", label: "DTAB" },
            { code: "DTCD", label: "DTCD" },
            { code: "OFF", label: "OFF" }
        ]
    };

    let currentViewDate = new Date();

    function getShiftForDate(date) {
        const baseDate = new Date(2026, 9, 4);
        const targetDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        
        const diffTime = targetDate - baseDate;
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        const weekDiff = Math.floor(diffDays / 7);
        const dayOfWeek = targetDate.getDay();

        const ww40Start = new Date(2026, 8, 27);
        const ww40End = new Date(2026, 9, 3);
        if (targetDate >= ww40Start && targetDate <= ww40End) {
            const ww40Map = {
                0: { shift: "D1", block: "A123" },
                1: { shift: "D3", block: "A123" },
                2: { shift: "AC4", block: "D123" },
                3: { shift: "AC4", block: "D123" },
                4: { shift: "AC4", block: "D123" },
                5: { shift: "D2", block: "A123" },
                6: { shift: "AC4", block: "A123" }
            };
            return ww40Map[dayOfWeek];
        }

        let cycleWeek = weekDiff % 6;
        if (cycleWeek < 0) cycleWeek += 6;

        let shift = "";
        let block = "";

        if (cycleWeek === 0 || cycleWeek === 1 || cycleWeek === 2) {
            block = (dayOfWeek >= 0 && dayOfWeek <= 2) ? "A123" : "D123";
            if (dayOfWeek === 0) shift = "A1";
            else if (dayOfWeek === 1) shift = "A2";
            else if (dayOfWeek === 2) shift = "A3";
            else shift = "AC4";
        } else if (cycleWeek === 3) {
            block = (dayOfWeek >= 0 && dayOfWeek <= 1) ? "D123" : "B123";
            if (dayOfWeek === 0) shift = "A2";
            else if (dayOfWeek === 1) shift = "A3";
            else if (dayOfWeek === 2) shift = "B1";
            else shift = "BD4";
        } else {
            block = "B123";
            if (dayOfWeek === 0) shift = "B2";
            else if (dayOfWeek === 1) shift = "B3";
            else if (dayOfWeek === 2) shift = "B1";
            else shift = "BD4";
        }

        return { shift, block };
    }

    function isUserWorkingOnDate(date, selectedShift) {
        const info = getShiftForDate(date);
        if (selectedShift === "A123") {
            return info.block === "A123";
        }
        return info.shift === selectedShift;
    }

    function updateShiftList() {
        const dept = document.getElementById("deptSelect").value;
        const shiftSelect = document.getElementById("shiftSelect");
        const previousVal = shiftSelect.value;
        shiftSelect.innerHTML = "";

        const options = SHIFT_OPTIONS[dept] || SHIFT_OPTIONS["OS_ES_DAY"];
        options.forEach(opt => {
            const el = document.createElement("option");
            el.value = opt.code;
            el.textContent = opt.label;
            shiftSelect.appendChild(el);
        });

        const savedShift = localStorage.getItem("selectedShift");
        const candidate = previousVal || savedShift;
        if (candidate && options.some(o => o.code === candidate)) {
            shiftSelect.value = candidate;
        }

        saveConfigAndRefresh();
    }

    function saveConfigAndRefresh() {
        const dept = document.getElementById("deptSelect").value;
        const shift = document.getElementById("shiftSelect").value;
        localStorage.setItem("selectedDept", dept);
        localStorage.setItem("selectedShift", shift);

        checkScheduleToday();
        renderCalendar();
    }

    function checkScheduleToday() {
        const today = new Date();
        const selectedShift = document.getElementById("shiftSelect").value;
        const isWorking = isUserWorkingOnDate(today, selectedShift);
        const info = getShiftForDate(today);

        const badge = document.getElementById("statusBadge");
        const text = document.getElementById("statusText");
        const desc = document.getElementById("statusDesc");

        const dateStr = `${today.getDate().toString().padStart(2, '0')}/${(today.getMonth()+1).toString().padStart(2, '0')}/${today.getFullYear()}`;

        if (isWorking) {
            badge.className = "status-badge working";
            badge.textContent = "HÔM NAY CÓ CA TRỰC";
            text.textContent = `Bạn đi làm: Ca ${info.shift} (${info.block})`;
            text.style.color = "#DC2626";
            desc.textContent = `Ngày: ${dateStr}. Mã ca đang chọn: ${selectedShift}`;
        } else {
            badge.className = "status-badge off";
            badge.textContent = "HÔM NAY ĐƯỢC NGHỈ";
            text.textContent = `Hôm nay là ca ${info.shift} (${info.block})`;
            text.style.color = "#16A34A";
            desc.textContent = `Ngày: ${dateStr}. Bạn không thuộc ca ${selectedShift} hôm nay.`;
        }
    }

    function renderCalendar() {
        const grid = document.getElementById("calendarGrid");
        grid.innerHTML = "";

        const year = currentViewDate.getFullYear();
        const month = currentViewDate.getMonth();

        document.getElementById("calendarMonthTitle").textContent = `Tháng ${month + 1} / ${year}`;

        const dayNames = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
        dayNames.forEach(name => {
            const el = document.createElement("div");
            el.className = "cal-day-name";
            el.textContent = name;
            grid.appendChild(el);
        });

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const today = new Date();
        const selectedShift = document.getElementById("shiftSelect").value;

        for (let i = 0; i < firstDay; i++) {
            const empty = document.createElement("div");
            empty.className = "cal-cell empty";
            grid.appendChild(empty);
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const thisDate = new Date(year, month, day);
            const isWork = isUserWorkingOnDate(thisDate, selectedShift);
            const shiftInfo = getShiftForDate(thisDate);
            const isToday = (today.getDate() === day && today.getMonth() === month && today.getFullYear() === year);

            const cell = document.createElement("div");
            cell.className = "cal-cell" + (isWork ? " work-day" : "") + (isToday ? " today" : "");

            cell.innerHTML = `
                <span>${day}</span>
                <span class="shift-tag">${shiftInfo.shift}</span>
            `;

            grid.appendChild(cell);
        }
    }

    function changeMonth(delta) {
        currentViewDate.setMonth(currentViewDate.getMonth() + delta);
        renderCalendar();
    }

    function formatICSDate(date) {
        const y = date.getFullYear();
        const m = (date.getMonth() + 1).toString().padStart(2, '0');
        const d = date.getDate().toString().padStart(2, '0');
        return `${y}${m}${d}`;
    }

    function exportICS() {
        const selectedShift = document.getElementById("shiftSelect").value;
        const start = new Date();
        start.setHours(0, 0, 0, 0);

        let lines = [
            "BEGIN:VCALENDAR",
            "VERSION:2.0",
            "PRODID:-//Lich Lam Viec Nha May//VN",
            "CALSCALE:GREGORIAN",
            `X-WR-CALNAME:Lịch Trực Ca (${selectedShift})`
        ];

        for (let i = 0; i < 90; i++) {
            const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
            if (isUserWorkingOnDate(d, selectedShift)) {
                const info = getShiftForDate(d);
                const nextDay = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
                const dtStart = formatICSDate(d);
                const dtEnd = formatICSDate(nextDay);
                lines.push(
                    "BEGIN:VEVENT",
                    `UID:shift-${selectedShift}-${dtStart}@lich-lam-viec`,
                    `DTSTAMP:${dtStart}T000000Z`,
                    `DTSTART;VALUE=DATE:${dtStart}`,
                    `DTEND;VALUE=DATE:${dtEnd}`,
                    `SUMMARY:Ca trực ${info.shift} (${info.block})`,
                    `DESCRIPTION:Mã ca cấu hình: ${selectedShift}`,
                    "END:VEVENT"
                );
            }
        }

        lines.push("END:VCALENDAR");
        const blob = new Blob([lines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `lich-truc-${selectedShift}.ics`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function requestNotification() {
        if (!("Notification" in window)) {
            alert("Trình duyệt này không hỗ trợ thông báo web.");
            return;
        }

        Notification.requestPermission().then(permission => {
            if (permission === "granted") {
                new Notification("Lịch Làm Việc", {
                    body: "Đã cấp quyền thông báo trên trình duyệt."
                });
            } else {
                alert("Quyền thông báo đang bị từ chối hoặc chặn.");
            }
        });
    }

    window.onload = function() {
        const savedDept = localStorage.getItem("selectedDept") || "OS_ES_DAY";
        document.getElementById("deptSelect").value = savedDept;
        updateShiftList();
    };
</script>
</body>
</html>
