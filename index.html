<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0068B5">
    <title>Lịch Trực Ca Nhà Máy (2026 – 2027)</title>
    <style>
        :root {
            --primary: #0068B5;
            --primary-dark: #004a82;
            --bg: #F0F4F8;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-sub: #64748B;
            --border: #E2E8F0;
            --green: #16A34A;
            --red: #DC2626;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 20px;
            border-radius: 18px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .header-card h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header-card p {
            font-size: 13px;
            opacity: 0.92;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            color: var(--primary-dark);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #F8FAFC;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-full {
            grid-column: span 2;
            background: var(--green);
            color: white;
        }

        button {
            padding: 12px 14px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: #E2E8F0;
            color: var(--text-main);
        }

        .status-box {
            margin-top: 14px;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            background: #F8FAFC;
            border: 1px solid var(--border);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .working {
            background: #FEE2E2;
            color: var(--red);
        }

        .off {
            background: #DCFCE7;
            color: var(--green);
        }

        .status-text {
            font-size: 16px;
            font-weight: 700;
        }

        .status-desc {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .calendar-header h3 {
            font-size: 16px;
            font-weight: 700;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }

        .cal-day-name {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
            padding-bottom: 6px;
        }

        .cal-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 13px;
            background: #F8FAFC;
        }

        .cal-cell.empty {
            background: transparent;
        }

        .cal-cell.today {
            border: 2px solid var(--primary);
            font-weight: 700;
        }

        .cal-cell.work-day {
            background: #FEE2E2;
            color: #B91C1C;
            font-weight: 700;
        }

        .cal-cell .tag {
            font-size: 9px;
            margin-top: 2px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-card">
        <h1>LỊCH LÀM VIỆC NHÀ MÁY</h1>
        <p>Cập nhật A123 & Mở rộng tính lịch 2026 – 2027</p>
    </div>

    <div class="card">
        <div class="card-title">⚙️ Cấu Hình Ca Trực</div>

        <div class="form-group">
            <label for="shiftCode">Mã Ca Trực</label>
            <select id="shiftCode" onchange="saveAndRender()">
                <option value="A123">A123 (CN, T2, T3 — gom A1/A2/A3)</option>
                <option value="AC4">AC4 (T4–T7 ca ngày)</option>
                <option value="A1">A1</option>
                <option value="A2">A2</option>
                <option value="A3">A3</option>
            </select>
        </div>

        <div class="btn-group">
            <button class="btn-primary" onclick="jumpToToday()">🎯 Hôm Nay</button>
            <button class="btn-secondary" onclick="exportICSYear(2027)">📅 Xuất Lịch 2027 (.ics)</button>
            <button class="btn-full" onclick="exportICS90Days()">📥 Tải Lịch 90 Ngày Tới (.ics)</button>
        </div>

        <div class="status-box">
            <div id="statusBadge" class="status-badge">...</div>
            <div id="statusText" class="status-text">...</div>
            <div id="statusDesc" class="status-desc">...</div>
        </div>
    </div>

    <div class="card">
        <div class="calendar-header">
            <button class="btn-secondary" style="padding: 6px 12px;" onclick="changeMonth(-1)">◀</button>
            <h3 id="monthTitle">...</h3>
            <button class="btn-secondary" style="padding: 6px 12px;" onclick="changeMonth(1)">▶</button>
        </div>
        <div class="calendar-grid" id="calGrid"></div>
    </div>
</div>

<script>
    let viewDate = new Date();

    // Mốc chuẩn từ bảng Q4: Chủ Nhật 15/11/2026 (WW 47) là tuần A123 (CN, T2, T3)
    const BASE_SUNDAY = new Date(2026, 10, 15);

    // Xác định tuần đó có chạy nhóm A123 (CN-T2-T3) hay không
    // Trong bảng Q4: WW47 (15/11) có A123; WW48 (22/11) có A123; WW49 (29/11) có A123; WW50 (06/12) có A123...
    function getWeekDayInfo(date) {
        const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        const diffDays = Math.floor((d - BASE_SUNDAY) / 86400000);
        const weekIdx = Math.floor(diffDays / 7);
        const dow = d.getDay(); // 0=CN, 1=T2, 2=T3, 3=T4, 4=T5, 5=T6, 6=T7

        // Xác định mã ca theo ngày trong tuần cho nhóm A123/AC4
        if (dow === 0) return { code: "A1", group: "A123", isSunToTue: true };
        if (dow === 1) return { code: "A2", group: "A123", isSunToTue: true };
        if (dow === 2) return { code: "A3", group: "A123", isSunToTue: true };
        return { code: "AC4", group: "AC4", isSunToTue: false };
    }

    function isWorkingDay(date, selectedCode) {
        const info = getWeekDayInfo(date);
        if (selectedCode === "A123") {
            // A123 gom chung CN, T2, T3
            return info.isSunToTue;
        }
        return info.code === selectedCode;
    }

    function saveAndRender() {
        const code = document.getElementById("shiftCode").value;
        localStorage.setItem("selected_shift_2026_2027", code);
        updateTodayStatus();
        renderCalendar();
    }

    function updateTodayStatus() {
        const now = new Date();
        const code = document.getElementById("shiftCode").value;
        const info = getWeekDayInfo(now);
        const work = isWorkingDay(now, code);

        const badge = document.getElementById("statusBadge");
        const text = document.getElementById("statusText");
        const desc = document.getElementById("statusDesc");
        const dStr = `${String(now.getDate()).padStart(2, "0")}/${String(now.getMonth() + 1).padStart(2, "0")}/${now.getFullYear()}`;

        if (work) {
            badge.className = "status-badge working";
            badge.textContent = "ĐI LÀM";
            text.style.color = "#DC2626";
            text.textContent = `Ca ${code} (hôm nay là ${info.code})`;
        } else {
            badge.className = "status-badge off";
            badge.textContent = "NGHỈ";
            text.style.color = "#16A34A";
            text.textContent = `Nghỉ ca ${code} (lịch ngày là ${info.code})`;
        }
        desc.textContent = `Ngày ${dStr}`;
    }

    function renderCalendar() {
        const grid = document.getElementById("calGrid");
        grid.innerHTML = "";
        const y = viewDate.getFullYear();
        const m = viewDate.getMonth();
        const code = document.getElementById("shiftCode").value;

        document.getElementById("monthTitle").textContent = `Tháng ${m + 1} / ${y}`;

        ["CN", "T2", "T3", "T4", "T5", "T6", "T7"].forEach(d => {
            const el = document.createElement("div");
            el.className = "cal-day-name";
            el.textContent = d;
            grid.appendChild(el);
        });

        const firstDay = new Date(y, m, 1).getDay();
        const totalDays = new Date(y, m + 1, 0).getDate();
        const today = new Date();

        for (let i = 0; i < firstDay; i++) {
            const empty = document.createElement("div");
            empty.className = "cal-cell empty";
            grid.appendChild(empty);
        }

        for (let day = 1; day <= totalDays; day++) {
            const d = new Date(y, m, day);
            const info = getWeekDayInfo(d);
            const work = isWorkingDay(d, code);
            const isToday = d.getDate() === today.getDate() && d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();

            const cell = document.createElement("div");
            cell.className = "cal-cell" + (work ? " work-day" : "") + (isToday ? " today" : "");
            cell.innerHTML = `<span>${day}</span><span class="tag">${code === "A123" && work ? "A123" : info.code}</span>`;
            grid.appendChild(cell);
        }
    }

    function changeMonth(delta) {
        viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + delta, 1);
        renderCalendar();
    }

    function jumpToToday() {
        viewDate = new Date();
        updateTodayStatus();
        renderCalendar();
    }

    function fmtICS(date) {
        return `${date.getFullYear()}${String(date.getMonth() + 1).padStart(2, "0")}${String(date.getDate()).padStart(2, "0")}`;
    }

    function downloadICS(startDate, endDate, filename) {
        const code = document.getElementById("shiftCode").value;
        let lines = [
            "BEGIN:VCALENDAR",
            "VERSION:2.0",
            "PRODID:-//Lich Lam Viec Nha May//VN",
            "CALSCALE:GREGORIAN"
        ];

        let cur = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());
        const last = new Date(endDate.getFullYear(), endDate.getMonth(), endDate.getDate());

        while (cur <= last) {
            if (isWorkingDay(cur, code)) {
                const info = getWeekDayInfo(cur);
                const next = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + 1);
                const s = fmtICS(cur);
                const e = fmtICS(next);
                lines.push(
                    "BEGIN:VEVENT",
                    `UID:${s}-${code}@lich-nha-may`,
                    `DTSTAMP:${s}T000000Z`,
                    `DTSTART;VALUE=DATE:${s}`,
                    `DTEND;VALUE=DATE:${e}`,
                    `SUMMARY:Ca trực ${code} (${info.code})`,
                    "END:VEVENT"
                );
            }
            cur.setDate(cur.getDate() + 1);
        }

        lines.push("END:VCALENDAR");
        const blob = new Blob([lines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function exportICS90Days() {
        const now = new Date();
        const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 90);
        downloadICS(now, end, "lich-a123-90-ngay.ics");
    }

    function exportICSYear(year) {
        const start = new Date(year, 0, 1);
        const end = new Date(year, 11, 31);
        downloadICS(start, end, `lich-a123-${year}.ics`);
    }

    window.onload = function() {
        const saved = localStorage.getItem("selected_shift_2026_2027");
        if (saved) {
            document.getElementById("shiftCode").value = saved;
        }
        updateTodayStatus();
        renderCalendar();
    };
</script>
</body>
</html>
